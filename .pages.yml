# Pages CMS 설정 — https://app.pagescms.org 에서 이 저장소를 열면 아래 게시판들이 글쓰기 화면에 나타납니다.
# 업로드한 이미지는 저장소에 올라간 뒤 GitHub Actions가 긴 변 1600px 이하로 자동으로 줄입니다.
media:
  - name: images
    label: 이미지
    input: uploads/images
    output: /uploads/images
    rename: safe
    categories: [image]
  - name: files
    label: 첨부파일
    input: uploads/files
    output: /uploads/files
    rename: false
    categories: [document, spreadsheet, compressed, video, audio, image]

content:
  - name: notice
    label: "소통공간 · 공지사항"
    type: collection
    path: content/notice
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{hour}{minute}{second}.md"
    view:
      fields: [title, date]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: 제목
        type: string
        required: true
      - name: date
        label: 작성일
        type: date
        options:
          time: true
          format: "yyyy-MM-dd HH:mm"
      - name: author
        label: 작성자
        type: string
        default: 여주시지속가능발전협의회
      - name: attachments
        label: 첨부파일
        type: file
        list: true
        options:
          media: files
      - name: body
        label: 본문
        type: rich-text
        options:
          format: html
          media: images
